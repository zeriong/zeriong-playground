name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # 1) 어떤 앱이 변경됐는지 감지
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      blog: ${{ steps.filter.outputs.blog }}
      api: ${{ steps.filter.outputs.api }}
      analyzer: ${{ steps.filter.outputs.analyzer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
            blog:
              - 'apps/blog/**'
              - 'packages/**'
            api:
              - 'apps/api/**'
              - 'packages/**'
            analyzer:
              - 'apps/analyzer/**'

  # 2) JS/TS 앱 린트/타입체크 (turbo 캐시 활용)
  verify:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build

  # 3) 변경된 앱만 이미지 빌드/푸시 (main push 일 때만)
  build-push:
    needs: [changes, verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, blog, api, analyzer]
    steps:
      - uses: actions/checkout@v4

      # 해당 앱이 변경되지 않았으면 스킵
      - name: Should build?
        id: gate
        run: echo "build=${{ needs.changes.outputs[matrix.app] }}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4) 온프레미스 배포 — self-hosted runner 에서 실행
  deploy:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: [self-hosted, onprem]
    steps:
      - uses: actions/checkout@v4
      - name: Pull & restart changed services
        working-directory: infra
        env:
          REGISTRY: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          TAG: ${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d
